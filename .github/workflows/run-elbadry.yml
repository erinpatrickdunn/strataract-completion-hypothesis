name: Run El-Badry Gaia TAP alpha-eta limits

on:
  workflow_dispatch:

jobs:
  elbadry-tap-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install astropy astroquery numpy pandas matplotlib

      - name: Run TAP analysis script
        env:
          GAIA_MAX_PRIMARIES: '200'     # tuneable via workflow_dispatch environment
          GAIA_A_MAX_AU: '20000'        # tuneable via workflow_dispatch environment
        run: |
          python scripts/run_elbadry_tap.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: alpha-eta-results
          path: gaia_small_alpha_eta_limits.csv
