name: Run El-Badry Gaia alpha-eta limits

on:
  workflow_dispatch:

jobs:
  elbadry-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install astropy requests numpy

      - name: Run analysis script
        run: |
          python scripts/run_elbadry.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: alpha-eta-results
          path: alpha_eta_limits_sample.csv
